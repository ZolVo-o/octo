name: CI

on:
  push:
  pull_request:

jobs:
  backend-and-bash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build C++ backend
        run: g++ -std=c++17 -O2 -Wall -Wextra backend/octo_backend.cpp -lsqlite3 -pthread -o /tmp/octo-backend

      - name: Bash syntax check
        run: bash -n octo install.sh
