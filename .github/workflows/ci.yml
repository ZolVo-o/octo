name: CI

on:
  push:
  pull_request:

jobs:
  rust-and-bash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Cargo check
        run: cargo check

      - name: Run tests
        run: cargo test

      - name: Build TUI
        run: cargo build --bin octo-tui

      - name: Bash syntax check
        run: bash -n octo install.sh lib/*.sh
